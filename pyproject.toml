[project]
name = "pac-man"
version = "0.1.0"
description = "A complete and playable Pac-Man game in Python"
requires-python = ">=3.10"
dependencies = [
    "mazegenerator",
    "pygame>=2.6.1",
]

[tool.uv.sources]
mazegenerator = { path = "lib/mazegenerator-2.1.0-py3-none-any.whl" }

[[tool.mypy.overrides]]
module = ["mazegenerator", "mazegenerator.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]